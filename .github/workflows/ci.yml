# Checks every push and pull request: runs the simulation tests and makes sure the committed app bundle
# (dist/, which GitHub Pages serves straight from the main branch) matches the source.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - name: Check the committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code --stat dist/ || (echo "dist/ is out of date: run 'npm run build' and commit it" && exit 1)
